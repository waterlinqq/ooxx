<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>map prop sheet</title>
    <style>
      body { margin: 0; background: #0b1120; color: #e2e8f0; font-family: system-ui, sans-serif; }
      #grid { display: grid; grid-template-columns: repeat(4, 320px); gap: 4px; padding: 4px; }
      .cell { position: relative; width: 320px; height: 320px; background: #0b1220; }
      .cell canvas { display: block; }
      .label { position: absolute; left: 8px; top: 6px; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px #000; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module">
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
      const bust = `?v=${Date.now()}`;
      const { buildMapPropModel } = await import(/* @vite-ignore */ `./js/board3d/MapPropModels.js${bust}`);
      const { MAP_PROP_KINDS, MAP_PROPS } = await import(/* @vite-ignore */ `./js/mapProps.js${bust}`);

      const params = new URLSearchParams(location.search);
      const T = Number(params.get('t') ?? 0.4);
      const SIZE = 320;

      const shared = new THREE.WebGLRenderer({ antialias: true });
      shared.setPixelRatio(2);
      shared.setSize(SIZE, SIZE);
      shared.shadowMap.enabled = true;
      shared.shadowMap.type = THREE.PCFSoftShadowMap;
      shared.toneMapping = THREE.ACESFilmicToneMapping;
      shared.toneMappingExposure = 1.3;
      const pmrem = new THREE.PMREMGenerator(shared);
      const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const grid = document.getElementById('grid');

      for (const kind of MAP_PROP_KINDS) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `${kind} ${MAP_PROPS[kind]?.name ?? ''}`;
        cell.appendChild(label);
        grid.appendChild(cell);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1220);
        scene.environment = envMap;
        scene.environmentIntensity = 0.55;
        scene.add(new THREE.AmbientLight(0xffffff, 0.42));
        scene.add(new THREE.HemisphereLight(0xbfdbfe, 0x1e293b, 0.7));
        const key = new THREE.DirectionalLight(0xfff6e6, 1.9);
        key.position.set(2.5, 4.5, 2.5);
        key.castShadow = true;
        key.shadow.mapSize.set(1024, 1024);
        key.shadow.camera.left = -1.2; key.shadow.camera.right = 1.2;
        key.shadow.camera.top = 1.2; key.shadow.camera.bottom = -1.2;
        key.shadow.bias = -0.0008;
        key.shadow.normalBias = 0.02;
        scene.add(key);
        const fill = new THREE.DirectionalLight(0x93c5fd, 0.4);
        fill.position.set(-2, 3, -3);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xe0e7ff, 0.7);
        rim.position.set(-3, 2, 3.5);
        scene.add(rim);

        // Same tile look as TileGrid.
        const tile = new THREE.Mesh(
          new THREE.BoxGeometry(0.88, 0.14, 0.88),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0x0f172a, emissiveIntensity: 0.35, roughness: 0.65, metalness: 0.15 })
        );
        tile.receiveShadow = true;
        scene.add(tile);
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(tile.geometry),
          new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.6 })
        );
        tile.add(edges);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(6, 6),
          new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 1 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.08;
        ground.receiveShadow = true;
        scene.add(ground);

        const model = buildMapPropModel(kind, 12345);
        model.root.position.y = 0.072;
        scene.add(model.root);
        model.animate?.(T);

        const frustum = Number(params.get('frustum') ?? 1.3);
        const cam = new THREE.OrthographicCamera(-frustum / 2, frustum / 2, frustum / 2, -frustum / 2, 0.1, 100);
        cam.position.set(0, 8.5, 8);
        cam.lookAt(0, 0.1, 0);

        shared.render(scene, cam);
        const snap = document.createElement('canvas');
        snap.width = SIZE * 2; snap.height = SIZE * 2;
        snap.style.width = `${SIZE}px`;
        snap.style.height = `${SIZE}px`;
        snap.getContext('2d').drawImage(shared.domElement, 0, 0);
        cell.appendChild(snap);
      }

      window.__ready = true;
    </script>
  </body>
</html>
