services:
  db:
    image: postgres:16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ooxx
      POSTGRES_USER: ooxx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ooxx -d ooxx"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ooxx:${POSTGRES_PASSWORD}@db:5432/ooxx
      PORT: "3001"
      SHARED_PATH: /shared
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  pgdata:
