<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>OOXX 戰棋</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111827'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18'%3E⚔%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="status-bar" id="statusBar">
      <div class="currency-group">
        <span class="currency-badge coin-badge" id="coinBalance" aria-label="金幣">
          <span class="currency-icon" data-ui-icon="coin" aria-hidden="true"></span>
          <span class="currency-amount">0</span>
        </span>
        <span class="currency-badge diamond-badge" id="diamondBalance" aria-label="鑽石">
          <span class="currency-icon" data-ui-icon="diamond" aria-hidden="true"></span>
          <span class="currency-amount">0</span>
        </span>
      </div>
    </header>
    <main class="game-main" id="gameMain">
      <!-- 戰鬥 -->
      <section class="game-screen active" id="screenBattle" data-screen="battle">
        <div class="screen-scroll lobby-layout" id="lobbyContent">
          <aside class="lobby-side lobby-side--left" aria-label="左側功能">
            <button class="lobby-side-btn" type="button" data-side-action="friends" aria-label="好友">
              <span class="lobby-side-icon" aria-hidden="true"></span>
              <span class="lobby-side-label">好友</span>
            </button>
            <button class="lobby-side-btn" type="button" data-side-action="mail" aria-label="信箱">
              <span class="lobby-side-icon" aria-hidden="true"></span>
              <span class="lobby-side-label">信箱</span>
            </button>
          </aside>

          <div class="lobby-main">
            <div class="online-section">
              <div class="mode-buttons mode-buttons--lobby" id="onlineModeButtons"></div>
              <div class="online-actions" id="onlineLobbyActions">
                <button class="btn primary btn-lg" id="findMatchBtn" type="button">開始匹配</button>
                <button class="btn btn-lg" id="createRoomBtn" type="button">建立房間</button>
                <div class="online-join-row">
                  <input class="online-room-input" id="roomCodeInput" type="text" maxlength="6" placeholder="房間碼" autocomplete="off" />
                  <button class="btn primary" id="joinRoomBtn" type="button">加入</button>
                </div>
              </div>
              <div class="survival-lobby-actions hidden" id="survivalLobbyActions">
                <button class="btn primary btn-lg" id="startSurvivalLobbyBtn" type="button">開始生存戰</button>
              </div>
              <div class="online-waiting hidden" id="onlineWaiting">
                <div class="online-match-indicator hidden" id="onlineMatchIndicator" aria-live="polite">
                  <p class="online-match-label"><span id="onlineMatchLabelText">匹配中</span><span class="online-match-dots" aria-hidden="true"><span></span><span></span><span></span></span></p>
                </div>
                <p class="online-room-code hidden" id="waitingRoomCodeLine"><strong id="waitingRoomCode"></strong></p>
                <button class="btn" id="cancelRoomBtn" type="button">取消</button>
              </div>
            </div>
            <button class="btn tutorial-cta hidden" id="startTutorial" type="button">
              <span class="tutorial-cta-icon">🎓</span>
              <span class="tutorial-cta-body">
                <span class="tutorial-cta-title">新手教學</span>
              </span>
            </button>
          </div>

          <aside class="lobby-side lobby-side--right" aria-label="右側功能">
            <button class="lobby-side-btn" type="button" data-side-action="account" aria-label="帳號">
              <span class="lobby-side-icon" aria-hidden="true"></span>
              <span class="lobby-side-label">帳號</span>
            </button>
            <button class="lobby-side-btn" type="button" data-side-action="settings" aria-label="設定">
              <span class="lobby-side-icon" aria-hidden="true"></span>
              <span class="lobby-side-label">設定</span>
            </button>
          </aside>
        </div>

        <div class="screen-scroll battle-layout hidden" id="battleContent">
          <section class="board-wrap">
            <div class="reserve-bar reserve-bar-enemy hidden" id="enemyReserveBar">
              <div class="reserve-bar-scroll">
                <div class="reserve-bar-cards" id="enemyReserveCards"></div>
              </div>
            </div>
            <div class="board-area">
              <div class="board-container">
                <div class="board-hud" id="boardHud">
                  <div class="board-timers">
                    <div class="survival-round hidden" id="survivalRound" aria-live="polite"></div>
                    <div class="stagnation-hint hidden" id="stagnationHint" aria-live="polite"></div>
                    <div class="match-timer hidden" id="matchTimer" aria-hidden="true">
                      <time class="match-timer-time" id="matchTimerText">00:00</time>
                      <div class="match-timer-track">
                        <div class="match-timer-fill" id="matchTimerFill"></div>
                      </div>
                    </div>
                    <div class="turn-timer hidden" id="turnTimer" aria-hidden="true">
                      <div class="turn-timer-track">
                        <div class="turn-timer-fill" id="turnTimerFill"></div>
                      </div>
                    </div>
                  </div>
                </div>
                <div id="boardCanvas" class="board-canvas-host"></div>
                <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
                <div class="ui-overlay ui-overlay--board hidden" id="turnToast" aria-live="polite">
                  <div class="ui-card" id="turnToastCard">
                    <p class="ui-card__body ui-card__body--lg" id="turnToastText"></p>
                  </div>
                </div>
                <div class="ui-overlay ui-overlay--board ui-overlay--raised hidden" id="winConditionToast" aria-live="polite">
                  <div class="ui-card ui-card--accent">
                    <div class="ui-card__title">🏆 勝利條件</div>
                    <p class="ui-card__body" id="winConditionText"></p>
                  </div>
                </div>
                <div class="reaction-bubble reaction-bubble--opp hidden" id="reactionBubble" aria-hidden="true">
                  <div class="reaction-bubble-icon" id="reactionBubbleIcon"></div>
                </div>
                <div class="reaction-bubble reaction-bubble--own hidden" id="reactionBubbleOwn" aria-hidden="true">
                  <div class="reaction-bubble-icon" id="reactionBubbleOwnIcon"></div>
                </div>
                <div class="battle-panels">
                  <div class="tutorial-panel ui-card ui-card--accent hidden" id="tutorialPanel" aria-live="polite">
                    <div class="tutorial-panel-head">
                      <span class="tutorial-badge" id="tutorialStep"></span>
                      <span class="tutorial-panel-title" id="tutorialTitle"></span>
                      <button class="btn tutorial-skip" id="tutorialSkip" type="button">跳過</button>
                    </div>
                  </div>
                  <div class="battle-action-menu hidden" id="battleActionMenu">
                    <div class="battle-action-sheet hidden" id="battleActionSheet" aria-hidden="true">
                      <div class="battle-action-emojis" id="battleActionEmojis"></div>
                      <div class="battle-action-tools">
                        <button class="item-battle-btn battle-action-tool hidden" id="itemBattleBtn" type="button">
                          <span class="item-battle-icon" id="itemBattleIcon"></span>
                        </button>
                        <button class="btn danger battle-action-tool battle-action-surrender hidden" id="surrender" type="button" title="投降">
                          <span class="battle-action-surrender-icon" data-ui-icon="surrender" aria-hidden="true"></span>
                          <span class="battle-action-surrender-label">投降</span>
                        </button>
                      </div>
                    </div>
                    <button class="battle-action-fab" id="battleActionFab" type="button" title="動作" aria-expanded="false" aria-controls="battleActionSheet">
                      <svg class="battle-action-fab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                        <circle cx="12" cy="5" r="2" fill="currentColor"/>
                        <circle cx="12" cy="12" r="2" fill="currentColor"/>
                        <circle cx="12" cy="19" r="2" fill="currentColor"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="reserve-bar reserve-bar-own hidden" id="ownReserveBar">
              <div class="reserve-bar-scroll">
                <div class="reserve-bar-cards" id="ownReserveCards"></div>
              </div>
              <div class="reserve-tutorial-pointer hidden" id="reserveTutorialPointer" aria-hidden="true">
                <span class="tutorial-pointer-hand">👆</span>
              </div>
            </div>
          </section>
        </div>
      </section>

      <!-- 編組 -->
      <section class="game-screen" id="screenFormation" data-screen="formation">
        <div class="screen-scroll">
          <div class="section-title section-title-compact">對戰模式</div>
          <div class="mode-buttons" id="formationModeButtons"></div>

          <div>
            <div class="section-title">
              我的編隊
              <span class="section-hint" id="formationCount"></span>
            </div>
            <div class="roster-lineup" id="formationLineup"></div>
          </div>

          <div id="formationItemSection">
            <div class="section-title section-title-compact">本場道具</div>
            <div class="item-picker" id="formationItems"></div>
          </div>

          <div>
            <div class="section-title">可選職業</div>
            <div class="class-grid" id="formationPool"></div>
          </div>

          <div class="formation-actions">
            <button class="btn primary btn-lg hidden" id="startSurvivalBtn" type="button">開始生存戰</button>
          </div>

        </div>
      </section>

      <!-- 圖鑑 -->
      <section class="game-screen" id="screenCodex" data-screen="codex">
        <div class="codex-tabs" id="codexTabs" role="tablist" aria-label="圖鑑分類">
          <button type="button" class="codex-tab active" role="tab" data-codex-tab="units" aria-selected="true">角色</button>
          <button type="button" class="codex-tab" role="tab" data-codex-tab="items" aria-selected="false">道具</button>
          <button type="button" class="codex-tab" role="tab" data-codex-tab="mechanisms" aria-selected="false">機關</button>
        </div>
        <div class="screen-scroll">
          <div class="class-picker" id="codexPicker"></div>
          <div class="class-detail" id="codexDetail">
            <div class="detail-preview-host" id="codexPreviewHost">
              <div class="range-legend" id="codexRangeLegend" aria-label="範圍圖例">
                <span><i class="range-swatch move"></i>移動範圍</span>
                <span><i class="range-swatch attack"></i>攻擊範圍</span>
              </div>
            </div>
            <div class="detail-info" id="codexDetailInfo"></div>
          </div>
        </div>
      </section>

      <!-- 任務 -->
      <section class="game-screen" id="screenQuests" data-screen="quests">
        <div class="screen-scroll">
          <div class="item-list" id="dailyQuestList"></div>
        </div>
      </section>

      <!-- 商店 -->
      <section class="game-screen" id="screenShop" data-screen="shop">
        <div class="screen-scroll">
          <div class="item-list" id="shopGrid"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="主選單">
      <button type="button" class="nav-item" data-nav="formation" aria-label="編組">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">編組</span>
      </button>
      <button type="button" class="nav-item" data-nav="codex" aria-label="圖鑑">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">圖鑑</span>
      </button>
      <button type="button" class="nav-item active" data-nav="battle" aria-label="戰鬥">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">戰鬥</span>
      </button>
      <button type="button" class="nav-item" data-nav="quests" aria-label="任務">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">任務</span>
      </button>
      <button type="button" class="nav-item" data-nav="shop" aria-label="商店">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">商店</span>
      </button>
    </nav>
    <div class="ui-overlay ui-overlay--toast hidden" id="purchaseToast" aria-live="polite">
      <div class="ui-card ui-card--compact" id="purchaseToastCard">
        <p class="ui-card__body ui-card__body--center" id="purchaseToastText"></p>
      </div>
    </div>
    <div id="gameEndOverlay" class="ui-overlay ui-overlay--modal hidden" aria-live="polite">
      <div class="ui-card ui-card--accent">
        <p class="ui-card__body ui-card__body--center ui-card__body--strong" id="endResult"></p>
      </div>
    </div>
    <div id="alertOverlay" class="ui-overlay ui-overlay--modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="alertMessage">
      <div class="ui-card ui-card--accent">
        <p class="ui-card__body ui-card__body--center" id="alertMessage"></p>
        <div class="ui-card__actions">
          <button class="btn primary btn-lg" id="alertOkBtn" type="button">確定</button>
        </div>
      </div>
    </div>
    <div id="confirmOverlay" class="ui-overlay ui-overlay--modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage">
      <div class="ui-card ui-card--accent">
        <p class="ui-card__body ui-card__body--center" id="confirmMessage"></p>
        <div class="ui-card__actions ui-card__actions--row">
          <button class="btn btn-lg" id="confirmCancelBtn" type="button">取消</button>
          <button class="btn primary btn-lg" id="confirmOkBtn" type="button">確認</button>
        </div>
      </div>
    </div>
    <div id="mailOverlay" class="ui-overlay ui-overlay--modal hidden" role="dialog" aria-modal="true" aria-labelledby="mailTitle">
      <div class="ui-card ui-card--mail">
        <div class="mail-modal-header">
          <h2 class="ui-card__title mail-modal-title" id="mailTitle">信箱</h2>
          <div class="mail-modal-header-actions">
            <button class="btn primary btn-sm hidden" id="mailClaimAllBtn" type="button">全部領取</button>
            <button class="mail-modal-close" id="mailCloseBtn" type="button" aria-label="關閉">✕</button>
          </div>
        </div>
        <div class="mail-list" id="mailList"></div>
        <p class="mail-empty hidden" id="mailEmpty">目前沒有郵件</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
