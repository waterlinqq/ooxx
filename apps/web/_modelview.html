<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; background: #0b1220; color: #e2e8f0; font: 12px system-ui; }
    .grid { display: grid; grid-template-columns: repeat(4, 190px); gap: 4px; padding: 4px; }
    .cell { position: relative; width: 190px; height: 190px; }
    .cell span { position: absolute; left: 6px; top: 4px; z-index: 2; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
    import { buildUnitModel } from './js/board3d/UnitModels.js';

    const params = new URLSearchParams(location.search);
    const classes = (params.get('c') ?? 'crabGeneral').split(',');
    const grid = document.getElementById('grid');

    const views = [
      { label: 'front', pos: [0, 1.1, 2.6] },
      { label: 'iso', pos: [2.0, 1.8, 2.0] },
      { label: 'top', pos: [0, 3.0, 0.4] },
      { label: 'side', pos: [2.6, 0.9, 0] },
    ];

    for (const classId of classes) {
      for (const team of ['blue', 'red']) {
        for (const view of views) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const tag = document.createElement('span');
          tag.textContent = `${classId} ${team} ${view.label}`;
          cell.appendChild(tag);
          grid.appendChild(cell);
          render(cell, classId, team, view);
        }
      }
    }

    function render(container, classId, team, view) {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1220);
      const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
      camera.position.set(...view.pos);
      camera.lookAt(0, 0.4, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(2);
      renderer.setSize(190, 190);
      renderer.shadowMap.enabled = true;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.3;
      container.appendChild(renderer.domElement);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.55;
      scene.add(new THREE.AmbientLight(0xffffff, 0.42));
      scene.add(new THREE.HemisphereLight(0xbfdbfe, 0x1e293b, 0.7));
      const key = new THREE.DirectionalLight(0xfff6e6, 1.9);
      key.position.set(4, 8, 4);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0x93c5fd, 0.45);
      fill.position.set(-3, 5, -4);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xe0e7ff, 0.65);
      rim.position.set(-4, 3, 5);
      scene.add(rim);

      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(1.0, 0.06, 1.0),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 })
      );
      floor.position.y = -0.03;
      scene.add(floor);

      const model = buildUnitModel(classId, team);
      model.root.position.set(0, 0.072, 0);
      scene.add(model.root);
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
