<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>spawn preview</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body { margin: 0; background: #0b1120; }
      #host { position: relative; width: 900px; height: 620px; }
      #fx { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="host"><div id="fx"></div></div>
    <script type="module">
      import { BoardScene } from './js/board3d/BoardScene.js';
      import { Game } from './js/game.js';

      const host = document.getElementById('host');
      const scene = new BoardScene(host, document.getElementById('fx'), {
        onCellClick: () => {},
        onUnitDragStart: () => {},
        onUnitDrop: () => {},
        onDragCancel: () => {},
        onReserveSelect: () => {},
        onUnitInspect: () => {},
      });
      scene.setVisible(true);

      const game = new Game();
      const state = game.getState();

      const cls = ['swordsman', 'archer', 'shield', 'mage', 'assassin', 'bomber'];
      const cells = [[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]];

      function makeUnit(i) {
        const classId = cls[i % cls.length];
        const c = game.constructor;
        return {
          id: `u${i}`,
          classId,
          team: i % 2 === 0 ? 'blue' : 'red',
          hp: 10,
          maxHp: 10,
          atk: 3,
        };
      }

      const board = state.board.map((r) => r.map(() => null));
      const base = { ...state, board, animating: false, phase: 'battle' };

      const realNow = performance.now.bind(performance);
      const t0 = realNow();
      let virt = t0;
      performance.now = () => virt;
      window.__setT = (ms) => { virt = t0 + ms; };

      window.__scene = scene;
      window.__deploy = (i) => {
        const [row, col] = cells[i];
        board[row][col] = { ...makeUnit(i), row, col };
        scene.sync({ ...base, board });
      };
      window.__deployAll = () => {
        cells.forEach((c, i) => {
          const [row, col] = c;
          board[row][col] = { ...makeUnit(i), row, col };
        });
        scene.sync({ ...base, board });
      };
      window.__ready = true;
    </script>
  </body>
</html>
