<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>board prop preview</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body { margin: 0; background: #0b1120; }
      #host { position: relative; width: 900px; height: 620px; }
      #fx { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="host"><div id="fx"></div></div>
    <script type="module">
      import { BoardScene } from './js/board3d/BoardScene.js';
      import { Game } from './js/game.js';

      const params = new URLSearchParams(location.search);
      const SIZE = Number(params.get('size') ?? 5);

      const host = document.getElementById('host');
      const noop = () => {};
      const scene = new BoardScene(host, document.getElementById('fx'), {
        onCellClick: noop,
        onUnitDragStart: noop,
        onUnitDrop: noop,
        onDragCancel: noop,
        onReserveSelect: noop,
        onUnitInspect: noop,
        onItemTarget: noop,
        canControlUnit: () => false,
      });
      scene.setVisible(true);

      const board = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      const mapProps = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

      const last = SIZE - 1;
      const mid = Math.floor(SIZE / 2);
      const put = (row, col, kind) => {
        if (mapProps[row]?.[col] !== undefined) mapProps[row][col] = { kind };
      };
      put(0, 0, 'potion');
      put(0, mid, 'spikes');
      put(0, last, 'web');
      put(mid, 1, 'stone');
      put(mid, last - 1, 'stone');
      put(last, 0, 'web');
      put(last, mid, 'potion');
      put(last, last, 'spikes');

      const unit = (id, classId, team, row, col) => ({
        id, classId, team, row, col, hp: 10, maxHp: 10, atk: 3,
      });
      board[1][mid] = unit('u1', 'swordsman', 'blue', 1, mid);
      board[mid + 1][mid] = unit('u2', 'archer', 'red', mid + 1, mid);
      board[last][last] = unit('u3', 'assassin', 'blue', last, last);

      const base = new Game().getState();
      scene.sync({
        ...base,
        board,
        mapProps,
        boardSize: SIZE,
        phase: 'battle',
        currentPlayer: 'blue',
        animating: false,
        validMoves: [],
        validTargets: [],
        validDeploy: [],
        validItemTargets: [],
        lastWinLine: [],
        pendingBombs: [],
      });

      window.__scene = scene;
      window.__ready = true;
    </script>
  </body>
</html>
