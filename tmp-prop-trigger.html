<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>map prop trigger preview</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body { margin: 0; background: #0b1120; }
      #host { position: relative; width: 620px; height: 620px; }
      #fx { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="host"><div id="fx"></div></div>
    <script type="module">
      import { BoardScene } from './js/board3d/BoardScene.js';
      import { Game } from './js/game.js';

      const SIZE = 3;
      const PROP_CELL = [1, 1];
      const START_CELL = [1, 0];

      const host = document.getElementById('host');
      const noop = () => {};
      const scene = new BoardScene(host, document.getElementById('fx'), {
        onCellClick: noop,
        onUnitDragStart: noop,
        onUnitDrop: noop,
        onDragCancel: noop,
        onReserveSelect: noop,
        onUnitInspect: noop,
        onItemTarget: noop,
        canControlUnit: () => false,
      });
      scene.setVisible(true);

      const base = new Game().getState();
      const blank = () => Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

      let board = blank();
      let mapProps = blank();

      const unit = (row, col) => ({
        id: 'hero', classId: 'swordsman', team: 'blue', row, col, hp: 6, maxHp: 10, atk: 3,
      });

      function render() {
        scene.sync({
          ...base,
          board,
          mapProps,
          boardSize: SIZE,
          phase: 'battle',
          currentPlayer: 'blue',
          animating: false,
          validMoves: [],
          validTargets: [],
          validDeploy: [],
          validItemTargets: [],
          lastWinLine: [],
          pendingBombs: [],
        });
      }

      // Reset to "unit standing next to an armed prop".
      window.__arm = (kind) => {
        scene.clear();
        board = blank();
        mapProps = blank();
        board[START_CELL[0]][START_CELL[1]] = unit(...START_CELL);
        mapProps[PROP_CELL[0]][PROP_CELL[1]] = { kind };
        render();
      };

      // Mirrors Game.applyTerrainAfterLanding: state is committed, the FX hook
      // fires, and only then does the board re-sync.
      window.__stepOn = (kind) => {
        const [row, col] = PROP_CELL;
        board[START_CELL[0]][START_CELL[1]] = null;
        board[row][col] = unit(row, col);
        if (kind !== 'web') mapProps[row][col] = null;

        const fx = { kind, row, col, unitId: 'hero' };
        if (kind === 'potion') fx.heal = 2;
        if (kind === 'spikes') { fx.damage = 2; fx.killed = false; }
        scene.playMapPropFx(fx);
        render();
      };

      // Deterministic review: unit already planted on the prop, then the trigger
      // timeline is posed by hand instead of by the clock.
      window.__plant = (kind) => {
        scene.clear();
        board = blank();
        mapProps = blank();
        const [row, col] = PROP_CELL;
        board[row][col] = unit(row, col);
        mapProps[row][col] = { kind };
        render();
      };

      window.__pose = (kind, p) => {
        const [row, col] = PROP_CELL;
        const key = `${row},${col}`;
        const manager = scene.mapPropManager;
        let marker = window.__posed;

        if (!marker) {
          marker = manager.markers.get(key);
          if (!marker) return false;
          // Detach exactly like a real trigger would, so the sync below cannot
          // delete the mesh we are posing.
          if (!marker.persistent) manager.markers.delete(key);
          if (kind !== 'web') mapProps[row][col] = null;
          render();
          window.__posed = marker;
        }

        marker.activate(p);
        return true;
      };

      window.__resetPose = () => {
        window.__posed = null;
      };

      window.__scene = scene;
      window.__ready = true;
    </script>
  </body>
</html>
