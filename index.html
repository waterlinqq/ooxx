<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OOXX 戰棋 — 三戰兩勝</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>OOXX 戰棋</h1>
    </header>

    <div class="layout" id="layout">
      <section class="board-wrap">
        <div class="score-bar">
          <div class="score-team blue" id="blueScore">藍隊 0 勝</div>
          <div class="round-badge" id="roundBadge">編隊階段</div>
          <div class="score-team red" id="redScore">紅隊 0 勝</div>
        </div>
        <div class="board-area">
          <div class="board-container">
            <div class="board" id="board"></div>
            <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <aside class="sidebar" id="sidebar">
        <nav class="tab-bar" id="tabBar">
          <button type="button" class="tab-btn active" data-tab="roster">角色</button>
          <button type="button" class="tab-btn" data-tab="lobby">大廳</button>
        </nav>

        <div class="tab-body" id="prepBody">
          <div class="tab-panel active" id="rosterTab" data-tab="roster">
            <div class="class-picker" id="classPicker"></div>
            <div class="class-detail" id="classDetail"></div>
          </div>

          <div class="tab-panel" id="lobbyTab" data-tab="lobby">
            <div class="panel flat" id="modePanel">
              <div class="mode-buttons" id="modeButtons"></div>
            </div>
            <div class="roster-lineup" id="rosterLineup"></div>
            <div class="class-grid" id="classGrid"></div>
            <button class="btn primary" id="confirmRoster" style="width: 100%">開始系列賽</button>
          </div>
        </div>

        <div class="battle-body hidden" id="battleBody">
          <div class="panel flat hidden" id="actionPanel">
            <div class="action-hint">拖曳移動／攻擊 · 點後備再點空格部署</div>
            <button class="btn hidden" id="endTurn" style="width: 100%; margin-top: 10px">結束回合</button>
          </div>

          <div class="panel flat hidden" id="reservePanel">
            <h2>藍隊後備</h2>
            <div class="reserve-list" id="reserveList"></div>
          </div>

          <div class="panel flat hidden" id="enemyPanel">
            <h2>紅隊</h2>
            <div class="enemy-list" id="enemyList"></div>
          </div>

          <div class="panel flat hidden" id="endPanel">
            <button class="btn success hidden" id="nextRound" style="width: 100%">下一局</button>
            <button class="btn primary hidden" id="restart" style="width: 100%; margin-top: 8px">重新開始</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
